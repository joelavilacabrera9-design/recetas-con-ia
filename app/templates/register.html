{% extends "base.html" %}
{% block page %}register{% endblock %}
{% block shell %}
<div class="auth">
  <section class="auth-intro">
    <a class="logo logo-light" href="/login">
      <img src="/favicon.ico" alt="" width="28" height="28">
      <span>Cocina con lo que hay</span>
    </a>
    <h1>Crea tu cuenta y arma tu inventario en un par de minutos.</h1>
    <p>Tus ingredientes y recetas quedan guardados solo para ti.</p>
  </section>
  <section class="auth-form">
    <form id="register-form" class="form">
      <h2>Crear cuenta</h2>
      <label class="field">
        <span>Nombre</span>
        <input type="text" name="nombre" required minlength="2" maxlength="80" autocomplete="name">
      </label>
      <label class="field">
        <span>Correo</span>
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password" aria-describedby="pass-hint">
        <small id="pass-hint" class="hint">Entre 8 y 64 caracteres, con letras y números.</small>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
      <p class="muted">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </form>
  </section>
</div>
{% endblock %}
